name: Finish v0.3.23 installation verification
on:
  workflow_dispatch:
    inputs:
      reuse_installation_checks:
        description: Reuse successful installation checks from run 41596544552; retry publishing only
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: finish-v0323
  cancel-in-progress: false
# Reuse the exact candidate whose component checks passed. Only the installation
# test fixture changed; never rebuild or replace the immutable candidate tag.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify original candidate and successful component checks
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_INSTALLATION: ${{ inputs.reuse_installation_checks }}
        run: |
          test "$(git rev-parse 'v0.3.23^{commit}')" = 185056aa184efb8217ba7aaa4a4594e037093a3a
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/41594501211" > "$RUNNER_TEMP/source-run.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/41594501211/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/41596544552/jobs?per_page=100" > "$RUNNER_TEMP/native-jobs.json"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const run=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/source-run.json'));
          if(run.status!=='completed'||run.path!=='.github/workflows/release.yml'||run.head_repository.full_name!==process.env.GITHUB_REPOSITORY||!/^[a-f0-9]{40}$/.test(run.head_sha))throw Error('Unexpected source run');
          for(const ref of [run.head_sha,'HEAD']) {
            execFileSync('git',['merge-base','--is-ancestor','v0.3.23',ref]);
            const paths=execFileSync('git',['diff','--name-only','v0.3.23',ref],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
            if(paths.some(p=>!p.startsWith('scripts/tests/')&&!p.startsWith('.github/workflows/')&&!p.startsWith('scripts/release/')&&p!=='scripts/build/build-agents.mjs'))throw Error('Application inputs changed');
          }
          const jobs=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/source-jobs.json')).flatMap(p=>p.jobs);
          const required=['Verify release tag','Changes and documentation','主控 CI / ubuntu-latest','主控 CI / windows-latest','Agent CI / ubuntu-latest','Agent CI / windows-latest','构建与部署脚本 CI','Docker application builds','数据库 CI / SQLite','数据库 CI / PostgreSQL','数据库 CI / MySQL 5.6.51','数据库 CI / MySQL 8.4.13','前端 CI / 构建或复用','主控与 Agent 兼容性','Build release candidate'];
          for(const name of required)if(!jobs.some(j=>(j.name===name||j.name==='Validate and build / '+name)&&j.conclusion==='success'))throw Error('Missing successful check: '+name);
          if(process.env.REUSE_INSTALLATION==='true') {
            const verified=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/native-jobs.json')).flatMap(p=>p.jobs);
            for(const name of ['verify','native (sqlite, managed)','native (sqlite, external)','native (sqlite, standalone)','native (sqlite, standalone-http)','native (local-postgres, managed)'])if(!verified.some(j=>j.name===name&&j.conclusion==='success'))throw Error('Missing installation check: '+name);
          }
          NODE
  native:
    needs: verify
    if: inputs.reuse_installation_checks != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {database: sqlite, proxy: managed}
          - {database: sqlite, proxy: external}
          - {database: sqlite, proxy: standalone}
          - {database: sqlite, proxy: standalone-http}
          - {database: local-postgres, proxy: managed}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sshguard-build-candidate
          path: dist/release
          run-id: 41594501211
          github-token: ${{ github.token }}
      - name: Verify exact original candidate
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS
          test "$(cat VERSION)" = 0.3.23
          test "$(cat AGENT_VERSION)" = 0.3.21
          tar -xzf sshguard-linux-amd64.tar.gz -C ..
      - name: Verify installation and upgrades with corrected test fixture
        run: sudo env "PATH=$PATH" GITHUB_ACTIONS=true SSHGUARD_NATIVE_DB=${{ matrix.database }} SSHGUARD_NATIVE_PROXY=${{ matrix.proxy }} sh scripts/tests/test-native-deploy.sh dist/sshguard-linux-amd64
      - name: Verify HTTPS and WebSockets
        if: matrix.proxy == 'managed' && matrix.database == 'sqlite'
        run: |
          mkdir -p .local/proxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout .local/proxy/key.pem -out .local/proxy/cert.pem
          NODE_EXTRA_CA_CERTS="$PWD/.local/proxy/cert.pem" node scripts/tests/test-reverse-proxy.mjs dist/sshguard-linux-amd64/sshguard-api "$(command -v nginx)" .local/proxy/cert.pem .local/proxy/key.pem
          SSHGUARD_TEST_FIXED_ORIGIN=true NODE_EXTRA_CA_CERTS="$PWD/.local/proxy/cert.pem" node scripts/tests/test-reverse-proxy.mjs dist/sshguard-linux-amd64/sshguard-api "$(command -v nginx)" .local/proxy/cert.pem .local/proxy/key.pem
  publish:
    needs: [verify, native]
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.native.result == 'success' || (inputs.reuse_installation_checks == true && needs.native.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: sshguard-build-candidate
          path: dist/release
          run-id: 41594501211
          github-token: ${{ github.token }}
      - name: Publish verified Agent and controller
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist/release && sha256sum -c SHA256SUMS)
          node scripts/release/publish-agent.mjs
          gh release create v0.3.23 dist/release/* --verify-tag --title 'SSHGuard v0.3.23' --notes-file docs/RELEASE-NOTES.md
  containers:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      tag: v0.3.23
